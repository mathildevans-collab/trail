name: Vérifications du dépôt

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité et sécurité
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt et l'historique
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Vérifier la syntaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            [[ "$file" == "supabase.min.js" ]] && continue
            node --check "$file"
          done < <(find . -path './.git' -prune -o -name '*.js' -print0)

      - name: Vérifier les versions PWA
        run: python scripts/check_versions.py

      - name: Vérifier les fichiers chargés par la PWA
        run: python scripts/check_asset_references.py

      - name: Vérifier les scripts Python
        run: python -m compileall -q scripts

      - name: Vérifier les messages des commits de la Pull Request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_commit_messages.py

      - name: Détecter les secrets manifestes
        run: python scripts/check_secrets.py

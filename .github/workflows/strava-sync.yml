name: Strava sync

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["activities.json", "README.md"]

permissions:
  contents: write

concurrency:
  group: strava
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          RT_OUT: ${{ runner.temp }}/new_rt
        run: python3 scripts/strava.py sync

      - name: Garder le jeton Strava à jour
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          RT_OUT: ${{ runner.temp }}/new_rt
        run: |
          if [ -f "$RT_OUT" ]; then
            if [ -n "$GH_PAT" ]; then
              GH_TOKEN="$GH_PAT" gh secret set STRAVA_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$RT_OUT"
            else
              echo "::error::GH_PAT absent ou expiré."
              exit 1
            fi
          fi

      - name: Repérer les nouvelles séances
        if: always()
        run: python3 scripts/notify.py "$RUNNER_TEMP/notif.txt"

      - name: Publier activities.json
        if: always()
        run: |
          git config user.name "strava-bot"
          git config user.email "strava-bot@users.noreply.github.com"
          git add activities.json lieux.json
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour Strava"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Prévenir sur le téléphone (ntfy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -s "$RUNNER_TEMP/notif.txt" ] && [ -n "$NTFY_TOPIC" ]; then
            echo "::add-mask::$NTFY_TOPIC"
            curl -fsS --max-time 20 \
              -H "Title: Cadenzo" \
              -H "Tags: running_shirt_with_sash" \
              -H "Click: https://mathildevans-collab.github.io/trail/" \
              --data-binary @"$RUNNER_TEMP/notif.txt" \
              "https://ntfy.sh/$NTFY_TOPIC" >/dev/null \
              || echo "::warning::Notification non envoyée."
          fi

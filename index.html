<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f5d46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cadenzo">
<title>Cadenzo</title>
<link rel="manifest" href="manifest.webmanifest?v=30">
<link rel="icon" href="icon.svg?v=30" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=30">
<link rel="preload" href="fonts/hanken-grotesk-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=30">
</head>
<body>
<main id="view" aria-live="polite"></main>

<nav class="tabs" id="tabs" aria-label="Navigation">
  <div class="tabs-in">
    <button data-t="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd’hui</button>
    <button data-t="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</button>
    <button data-t="forme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 5-8 4 5"/><path d="M3 21h18"/></svg>Forme</button>
    <button data-t="course"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20l6-10 4 6 3-4 7 8z"/><path d="M15 12V4l4 2-4 2"/></svg>Mes courses</button>
  </div>
</nav>

<section class="racemode" id="rm" hidden aria-label="Mode Course"><div class="rm-in" id="rmIn"></div></section>
<div class="sheet" id="sheet" hidden><div class="sheet-bg" data-close="1"></div><div class="sheet-in" role="dialog" aria-modal="true" aria-label="Détail"><div class="grab"></div><button class="sheet-x" data-close="1" aria-label="Fermer">×</button><div id="sheetBody"></div></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
<input type="file" id="fileGpxRace" accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden>
<input type="file" id="fileGpx" accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileGarmin" accept=".zip,.json,application/zip,application/json" multiple hidden>

<script src="data.js?v=30"></script>
<script src="fit.js?v=30"></script>
<script src="safe.js?v=30"></script>
<script src="garmin.js?v=30"></script>
<script src="workout.js?v=30"></script>
<script src="app.js?v=30"></script>
<script>if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});</script>
</body>
</html>

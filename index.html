:root{

  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1612; --card:#17211B; --ink:#E9F0EB; --muted:#93A39A; --line:#26342B;
  --brand:#B3A6FF; --brand-ink:#16113A; --brand-soft:#2A2548;
  --ok:#7CCB98; --ok-soft:#1B3325; --warn:#E3A857; --warn-soft:#3A2B12; --off:#F08A98; --off-soft:#3B1D22; color-scheme:dark}}
:root[data-theme="dark"]{

  --brand:#B3A6FF; --brand-ink:#16113A; --brand-soft:#2A2548;
  --ok:#7CCB98; --ok-soft:#1B3325; --warn:#E3A857; --warn-soft:#3A2B12; --off:#F08A98; --off-soft:#3B1D22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 150px}
.wrap{max-width:540px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1}
button{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.count{text-align:right;font-family:var(--display);font-weight:700;font-size:24px;color:var(--brand);line-height:1}
.count span{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.progtxt{font-size:12px;color:var(--muted);margin:5px 0 14px;font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wk{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;margin-bottom:10px}
.wk button{height:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:22px;cursor:pointer;color:var(--ink)}
.wk button:disabled{opacity:.3}
.wkc{text-align:center;min-width:0}
.wkc strong{display:block;font-family:var(--display);font-size:22px;margin-top:2px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.dpill{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;min-height:64px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;min-width:0}
.dpill .dl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.dpill .dn{font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;line-height:1}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);background:transparent}
.dot.none{border-color:transparent}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dpill.today .dn{color:var(--brand)}
.dpill.today{border-color:var(--brand)}
.dpill[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.dpill[aria-pressed="true"] .dl,.dpill[aria-pressed="true"] .dn{color:var(--brand-ink)}
.dpill[aria-pressed="true"] .dot{border-color:var(--brand-ink)}
.dpill[aria-pressed="true"] .dot.done{background:var(--brand-ink)}
.banner{background:var(--brand-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.tag.q{background:var(--brand-soft);color:var(--brand)}
.tag.e{background:var(--ok-soft);color:var(--ok)}
.tag.l{background:var(--warn-soft);color:var(--warn)}

.hero h2{font-size:30px;margin:2px 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.hero p{margin:0}

details summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;color:var(--brand)}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:22px;line-height:1}
details[open] summary::after{content:"−"}
details .in{padding-bottom:4px;font-size:15px}
details .in h4{margin:12px 0 4px;font-family:var(--display);font-size:17px}
details .in h4:first-child{margin-top:0}
.ex{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.ex span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.nut{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0}
.nut dt{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-top:3px}
.nut dd{margin:0 0 8px}
.coach{background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.coach .eyebrow{color:inherit;opacity:.8;display:block;margin-bottom:3px}
.review{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.badge{font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.off{background:var(--off-soft);color:var(--off)}
.src{font-size:12px;color:var(--muted)}
.rnum{font-variant-numeric:tabular-nums;font-weight:600;margin:0 0 6px}
.review ul{margin:0;padding-left:18px}
.review li{margin-bottom:4px}
.wrep{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.wrep h3{font-size:20px;margin-bottom:10px}
.wrep .stats{margin-bottom:10px}
.act{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.act .in{max-width:540px;margin:0 auto}
.go{width:100%;min-height:56px;border:0;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:17px;cursor:pointer}
.go.isdone{background:var(--ok-soft);color:var(--ok)}
.rest p{color:var(--muted)}
.syncbar{margin:0 0 12px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:var(--card)}
.card .syncbar{border:0;padding:0;margin:0}
.syncbar .sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.syncbar .sw{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;margin-left:4px}
.pill.ok{background:var(--ok-soft,#dff3e6);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.off{background:var(--off-soft,#fbe3e3);color:var(--off)}
.sres{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font-size:14px}
.sres p{margin:4px 0}.sres ul,.sres ol{margin:6px 0 0;padding-left:20px}.sres li{margin-bottom:3px}
.sres.err{border:2px solid var(--off)}.sres.ok{border:2px solid var(--ok)}.sres.info{border-color:var(--brand)}
.sres .btn{margin-top:8px}
.pts{margin:0;padding-left:18px}.pts li{margin-bottom:6px}
.strat{padding:10px 0;border-top:1px solid var(--line)}.strat:first-of-type{border-top:0;padding-top:0}.strat p{margin:4px 0 0}
.kit{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 0;border-top:1px solid var(--line);min-height:48px;font:inherit;color:inherit;cursor:pointer}
.kit .bx{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--brand-ink)}
.kit[aria-pressed="true"] .bx{background:var(--brand);border-color:var(--brand)}
.kit[aria-pressed="true"]{color:var(--muted)}
.clubnote{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.clubnote.pacenote{background:var(--brand-soft,#ece9fb);color:var(--brand)}
.adj{margin-bottom:12px}
.adj.pending{border-color:var(--warn);border-width:2px}
.adj.on{border-color:var(--ok);border-width:2px}
.adj .state{margin:0 0 6px;font-weight:700;color:var(--ok)}
.adj .lead{margin:0 0 6px;font-weight:600}
.adj .prop{margin:0 0 4px}
.adj h4{margin:12px 0 4px;font-family:var(--display);font-size:17px}
.why{margin:0;padding-left:18px}
.why li{margin-bottom:6px}
.why li span{display:block;font-size:13px;color:var(--muted)}
.adj details{margin-top:10px}
.tag.adjt{background:var(--warn-soft);color:var(--warn)}
.loop{border-top:1px solid var(--line);padding:12px 0}
.loop:first-of-type{border-top:0}
.lh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lh .tag{flex:none}
.lk{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;margin:2px 0}

.plan-row.rec .bar i{background:var(--ok)}

.plan-row .r{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.phase{margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{font-size:21px;margin-bottom:8px}
.card details{margin-top:0}
.card details+details{border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.scroll{overflow-x:auto}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-weight:600;cursor:pointer;min-height:48px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);width:100%}
.btn.small{min-height:44px}
.fileb{display:block;width:100%;text-align:center;padding:14px;border:1px dashed var(--brand);border-radius:12px;color:var(--brand);font-weight:600;cursor:pointer;margin-top:10px}
.fileb input{position:absolute;opacity:0;width:1px;height:1px}
.fileb:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--muted);font-size:14px}
.msg{margin-top:10px;font-size:14px}
svg text{fill:var(--muted);font-family:var(--body);font-size:9px}
svg .lbl{fill:var(--ink);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);gap:2px;

nav button[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.prog i{transition:none}}
</style>

  if(T==="courtes") return {tag:"q",type:"Côtes courtes",km:8,dp:n*20,txt:"Échauffement 15 min, puis "+n+" côtes courtes de 30 s (pente de 8 à 12 %), effort vif, descente en marchant, 2 min de récupération. Environ +20 m chacune."};

function pz(n){return (n<10?"0":"")+n;}
function hm(m){var h=Math.floor(m/60), mm=Math.round(m%60); if(mm===60){h++;mm=0;} return h+" h "+pz(mm);}
function dur(sec){var h=Math.floor(sec/3600), m=Math.round((sec%3600)/60); if(m===60){h++;m=0;} return h>0?h+" h "+pz(m):m+" min";}

function num(x){
  if(typeof x==="number")return x; if(x==null)return NaN; var s=String(x).trim();
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,""); else s=s.replace(",",".");

}

// ---------- bilan du coach (d'après les activités réelles) ----------
function review(s,ac){
  var L=[], lvl=0, fast=false;   // 0 = en cible, 1 = à ajuster, 2 = hors cible
  function bump(n){if(n>lvl)lvl=n;}
  if(s.k==="thu"){
    L.push("Séance du club enregistrée. Elle compte dans ta semaine, rien à comparer avec le plan.");
    return {lvl:0,lines:L,fast:false};
  }
  if(s.km>0){
    var r=ac.km/s.km;
    if(r>1.15){bump(1);L.push("Plus long que prévu : "+kmStr(ac.km)+" km pour "+kmStr(s.km)+" prévus. Garde de la fraîcheur pour la suite.");}
    else if(r>=0.9){L.push("Distance dans la cible : "+kmStr(ac.km)+" km pour "+kmStr(s.km)+" prévus.");}
    else if(r>=0.75){bump(1);L.push("Un peu court : "+kmStr(ac.km)+" km pour "+kmStr(s.km)+" prévus.");}
    else{bump(2);L.push("Nettement en dessous : "+kmStr(ac.km)+" km pour "+kmStr(s.km)+" prévus. Si c’était de la fatigue, tu as bien fait. Sinon, ne rattrape pas d’un coup.");}
  }
  if(s.dp>=100&&ac.dp>0){
    var dr=ac.dp/s.dp;
    if(dr<0.75){bump(dr<0.5?2:1);L.push("Il manque du dénivelé : +"+ac.dp+" m pour +"+s.dp+" m prévus. C’est lui qui prépare le THP40.");}
    else if(dr>1.3){L.push("Beaucoup de dénivelé : +"+ac.dp+" m pour +"+s.dp+" m prévus. Bien, si tu récupères correctement.");}
    else{L.push("Dénivelé dans la cible : +"+ac.dp+" m pour +"+s.dp+" m prévus.");}
  }
  if((s.tag==="e"||s.tag==="l")&&ac.t>0&&ac.km>0){
    var eff=ac.t/(ac.km+ac.dp/100);
    if(eff<RACE_PACE*0.97){fast=true;bump(1);L.push("Trop rapide pour une sortie facile : tu cours à ton allure de course ("+pace(eff)+" par km-effort, cible 4 h 55 : "+pace(RACE_PACE)+"). Ralentis pour rester en zone 2.");}
  }
  return {lvl:lvl,lines:L,fast:fast};
}
var BADGE=[["ok","En cible"],["warn","À ajuster"],["off","Hors cible"]];
function reviewHTML(s,ac){
  var r=review(s,ac), b=BADGE[r.lvl];
  var nums="Réel : "+kmStr(ac.km)+" km"+(ac.dp?" · +"+ac.dp+" m":"")+(ac.t?" · "+dur(ac.t)+" · "+pace(ac.t/ac.km)+"/km":"");
  return '<section class="review"><div class="rhead"><span class="badge '+b[0]+'">'+b[1]+'</span><span class="src">Bilan du coach</span></div><p class="rnum">'+nums+'</p><ul>'+r.lines.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></section>';
}
function weekStats(p){
  var n=0,pk=0,ak=0,pd=0,ad=0,fast=0,c=[0,0,0];
  p.s.forEach(function(s){var ac=actual[p.n+"-"+s.k]; if(!ac)return; n++; var r=review(s,ac); c[r.lvl]++; if(r.fast)fast++; if(s.km){pk+=s.km;ak+=ac.km;} if(s.dp>=100){pd+=s.dp;ad+=ac.dp;}});
  return {n:n,pk:pk,ak:ak,pd:pd,ad:ad,fast:fast,c:c,pc:pk?Math.round(ak/pk*100):0,off:c[2]};
}

function cycleDay(t){
  if(!cycle.on||!cycle.start)return 0; var st=Date.parse(cycle.start+"T00:00:00Z"); if(isNaN(st))return 0;
  var d=Math.floor((t-st)/86400000); if(d<0)return 0; return (d%(cycle.len||28))+1;

        if(s.exists){var d=s.data()||{}; done=d.done||{}; actual=d.actual||{}; ci=d.ci||{}; adj=d.adj||{}; if(d.cycle)cycle=d.cycle; saveLocal(); render();}
        else if(first&&(Object.keys(done).length||Object.keys(actual).length)){saveRemote();}
        first=false;
      },function(){});
    });
  }).catch(function(){});
}
})();
</script>
